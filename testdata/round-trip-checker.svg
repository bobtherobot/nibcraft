<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- VectorCraft's pen nib, as cursors.rs pen() draws it: tip at the hotspot. -->
  <polygon id="nib" points="4,4 8,16 12,20 20,12 16,8" fill="#000"/>
  <circle id="eye" cx="10" cy="10" r="1.4" fill="#fff"/>
  <line id="stem" x1="14" y1="18" x2="18" y2="22" stroke="#000" stroke-width="1.2"/>
  <!-- The click point; not drawn. -->
  <circle id="hotspot" cx="4" cy="4" r="0.5" fill="#f00"/>
</svg>
